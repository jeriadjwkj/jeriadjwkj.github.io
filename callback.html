<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting to TikTok</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin:0 auto;padding:48px 16px;text-align:center;color:#1a1a1a;background:#fff}</style>
</head>
<body>
<h2>Connecting to TikTok…</h2>
<p id="msg">Handing the login back to the uploader on this computer.</p>
<script>
  // Forward TikTok's ?code=...&state=... to the local uploader script
  var target = "http://localhost:8723/callback" + location.search;
  if (location.search) {
    location.replace(target);
  } else {
    document.getElementById("msg").textContent = "Nothing to do here.";
  }
</script>
</body>
</html>
